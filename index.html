<body>
<div class="container">
  <div class="status" id="status">스프레드시트 불러오는 중...</div>

  <div class="card" id="card">
    <div class="loading">⏳ 단어 데이터를 불러오고 있어요...</div>
  </div>

  <div class="countdown" id="countdown"></div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress" style="width:0%"></div>
  </div>

  <div class="controls">
    <button class="btn btn-icon" onclick="prevWord()" title="이전 단어">⬅</button>
    <button class="btn btn-main" id="playBtn" onclick="togglePlay()">▶ 시작</button>
    <button class="btn btn-icon" onclick="nextWord()" title="다음 단어">➡</button>
  </div>

  <div class="options-grid">
    <div class="volume-row">
      <span>🔈</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="30" oninput="setVolume(this.value)">
      <span>🔊</span>
    </div>
    <div class="wait-row">
      <span>⏱ 대기</span>
      <input type="range" id="waitSlider" min="1" max="10" value="5" oninput="setWait(this.value)">
      <span class="wait-val" id="waitVal">5초</span>
    </div>
    <div class="option-row">
      <input type="checkbox" id="hideMeaningCheck" onchange="onHideMeaningToggle(this.checked)">
      <label for="hideMeaningCheck">단어/예문 뜻 가리기 (TTS 완료 전 표시)</label>
    </div>
    <div class="option-row">
      <input type="checkbox" id="readExampleCheck" onchange="readExample = this.checked">
      <label for="readExampleCheck">예문 읽기</label>
    </div>
  </div>

  <div class="audio-source" id="audioSource"></div>
  <div class="counter" id="counter"></div>
  <button class="sheet-link-btn" onclick="openSheet()">📊 스프레드시트로 바로 가기</button>
</div>

<script>
const SHEET_ID = '1THexNEpg2h7CnceWDumdRNYziQzq3B9ptwzKLFO7hvQ';
const PROXY_URL = 'https://toeicvoka.dororoko.workers.dev';

let words = [];
let usedIndices = [];
let history = [];
let historyPos = -1;
let nextIdx = null;
let isPlaying = false;
let waitTimer = null;
let countdownTimer = null;
let revealTimer = null;
let currentVolume = 0.3;
let waitSeconds = 5;
let hideMeaning = false;
let readExample = false;

// ===== 설정 =====
function setVolume(val) { currentVolume = val / 100; }

function setWait(val) {
  waitSeconds = parseInt(val);
  document.getElementById('waitVal').textContent = val + '초';
}

function onHideMeaningToggle(checked) {
  hideMeaning = checked;
  const meaning = document.querySelector('.meaning');
  const exKo = document.querySelector('.example-ko');
  if (meaning) hideMeaning ? meaning.classList.add('hidden-meaning') : meaning.classList.remove('hidden-meaning');
  if (exKo) hideMeaning ? exKo.classList.add('hidden-meaning') : exKo.classList.remove('hidden-meaning');
}

function openSheet() {
  window.open(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`, '_blank');
}

// ===== 구글 시트 로드 (JSONP) =====
window.handleSheetData = function(data) {
  try {
    const allRows = data.table.rows;
    if (!allRows || allRows.length === 0) throw new Error('데이터 행이 없어요.');
    const cols = allRows[0].c.map(c => String(c?.v ?? '').trim().toLowerCase());
    const dataRows = allRows.slice(1);

    const fc = (key) => cols.findIndex(c => c.includes(key));
    const colMap = {
      spelling: fc('스펠링') >= 0 ? fc('스펠링') : fc('spelling'),
      pos: fc('품사'), meaning: fc('뜻'), ipa: fc('ipa'),
      krPron: fc('한국어 발음') >= 0 ? fc('한국어 발음') : fc('발음'),
      exEn: fc('예문'),
      exKo: fc('예문 한국어') >= 0 ? fc('예문 한국어') : fc('한국어 해석'),
    };

    if (colMap.spelling < 0) throw new Error('스펠링 컬럼을 찾을 수 없어요. 컬럼: ' + cols.join(', '));

    words = dataRows.map(r => {
      const g = (i) => i >= 0 ? String(r.c[i]?.v ?? '').trim() : '';
      return {
        spelling: g(colMap.spelling), pos: g(colMap.pos),
        meaning: g(colMap.meaning), ipa: g(colMap.ipa),
        krPron: g(colMap.krPron), exEn: g(colMap.exEn), exKo: g(colMap.exKo),
      };
    }).filter(w => w.spelling);

    if (words.length === 0) throw new Error('단어 데이터가 없어요.');
    document.getElementById('status').textContent = `✅ ${words.length}개 단어 로드 완료`;
    document.getElementById('counter').textContent = `총 ${words.length}개 단어`;

    const firstIdx = getRandomIndex();
    showWord(firstIdx, true);
  } catch(e) { showLoadError(e.message); }
};

function loadSheet() {
  const s = document.createElement('script');
  s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:handleSheetData&gid=0`;
  s.onerror = () => showLoadError('스크립트 로드 실패');
  document.body.appendChild(s);
  setTimeout(() => {
    if (words.length === 0 && !document.getElementById('status').textContent.includes('✅'))
      showLoadError('응답 없음 (10초 초과)');
  }, 10000);
}

function showLoadError(msg) {
  document.getElementById('status').innerHTML = `<span class="error">❌ 불러오기 실패</span>`;
  document.getElementById('card').innerHTML = `
    <div class="error" style="text-align:left;font-size:13px;line-height:1.8;">
      <b>스프레드시트를 불러올 수 없어요.</b><br><br>오류: ${msg}<br><br>
      <small>1. 공유 설정 → "링크가 있는 모든 사용자" → 뷰어<br>
      2. 첫 번째 시트에 데이터가 있는지<br>
      3. 헤더 행 컬럼명 확인</small>
    </div>`;
}

// ===== 랜덤 인덱스 =====
function getRandomIndex() {
  if (usedIndices.length >= words.length) usedIndices = [];
  let idx;
  do { idx = Math.floor(Math.random() * words.length); }
  while (usedIndices.includes(idx) && words.length > 1);
  usedIndices.push(idx);
  return idx;
}

// ===== 프리로딩 =====
const preloadCache = {};

function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(t));
}

function getGoogleTTSUrl(text) {
  return `${PROXY_URL}/?q=${encodeURIComponent(text)}&tl=en`;
}

function testAudioLoadable(url, ms) {
  return new Promise((resolve) => {
    const audio = new Audio();
    let done = false;
    const finish = (ok) => { if (!done) { done = true; resolve(ok ? audio : null); } };
    const t = setTimeout(() => finish(false), ms);
    audio.oncanplaythrough = () => { clearTimeout(t); finish(true); };
    audio.onerror = () => { clearTimeout(t); finish(false); };
    audio.preload = 'auto';
    audio.src = url;
    audio.load();
  });
}

function preloadWord(word) {
  if (preloadCache[word]) return preloadCache[word];
  preloadCache[word] = (async () => {
    // 1순위: Dictionary API
    try {
      const res = await fetchWithTimeout(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`, 2500);
      const data = await res.json();
      const url = data[0]?.phonetics?.find(p => p.audio)?.audio || null;
      if (url) {
        const el = new Audio(); el.preload = 'auto'; el.src = url; el.load();
        return { type: 'dict', audioEl: el };
      }
    } catch {}
    // 2순위: Google TTS 프록시
    const gAudio = await testAudioLoadable(getGoogleTTSUrl(word), 1800);
    if (gAudio) return { type: 'gtts', audioEl: gAudio };
    return { type: 'tts', audioEl: null };
  })();
  return preloadCache[word];
}

// 예문 TTS 프리로딩 (Google TTS 프록시만 사용)
function preloadExample(text) {
  if (!text) return Promise.resolve(null);
  const key = 'ex:' + text;
  if (preloadCache[key]) return preloadCache[key];
  preloadCache[key] = testAudioLoadable(getGoogleTTSUrl(text), 2500);
  return preloadCache[key];
}

// ===== 음성 재생 =====
let cachedVoices = [];
function refreshVoices() { cachedVoices = window.speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) { refreshVoices(); window.speechSynthesis.onvoiceschanged = refreshVoices; }

function getBestVoice() {
  const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
  const names = ['Google US English', 'Microsoft Aria Online', 'Microsoft Jenny Online', 'Samantha'];
  for (const n of names) { const v = voices.find(v => v.name.includes(n)); if (v) return v; }
  return voices.find(v => v.lang === 'en-US' && !v.localService)
    || voices.find(v => v.lang === 'en-US')
    || voices.find(v => v.lang.startsWith('en'));
}

function setSourceLabel(text) {
  const el = document.getElementById('audioSource');
  if (el) el.textContent = text;
}

function playBrowserTTS(text, onEnd) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.92; u.pitch = 1.0; u.volume = currentVolume;
    const voice = getBestVoice();
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    u.onend = onEnd; u.onerror = onEnd;
    setTimeout(() => window.speechSynthesis.speak(u), 30);
    setSourceLabel('브라우저 내장 TTS' + (voice ? ` (${voice.name})` : ''));
  } catch { onEnd && onEnd(); }
}

// 단어 발음 재생 → 완료 콜백
function playWordAudio(word, onEnd) {
  const icon = document.getElementById('audioIcon');
  if (icon) icon.classList.add('playing');

  const finish = () => {
    if (icon) icon.classList.remove('playing');
    onEnd && onEnd();
  };

  preloadWord(word).then(entry => {
    if (entry.type === 'tts' || !entry.audioEl) {
      playBrowserTTS(word, finish);
      return;
    }
    const el = entry.audioEl;
    currentAudioEl = el;
    el.volume = currentVolume;
    try { el.currentTime = 0; } catch {}
    el.onended = () => { currentAudioEl = null; finish(); };
    el.onerror = () => { currentAudioEl = null; playBrowserTTS(word, finish); };
    el.play()
      .then(() => setSourceLabel(entry.type === 'dict' ? 'Dictionary API 원어민 음성' : 'Google Translate TTS'))
      .catch(() => playBrowserTTS(word, finish));
  }).catch(() => playBrowserTTS(word, finish));
}

// 예문 TTS 재생 → 완료 콜백
function playExampleAudio(text, onEnd) {
  const exEl = document.querySelector('.example-en');
  if (exEl) exEl.classList.add('example-playing');
  const finish = () => {
    if (exEl) exEl.classList.remove('example-playing');
    onEnd && onEnd();
  };

  preloadExample(text).then(audioEl => {
    if (!audioEl) { playBrowserTTS(text, finish); return; }
    currentAudioEl = audioEl;
    audioEl.volume = currentVolume;
    try { audioEl.currentTime = 0; } catch {}
    audioEl.onended = () => { currentAudioEl = null; finish(); };
    audioEl.onerror = () => { currentAudioEl = null; playBrowserTTS(text, finish); };
    audioEl.play()
      .then(() => setSourceLabel('예문 Google Translate TTS'))
      .catch(() => playBrowserTTS(text, finish));
  }).catch(() => playBrowserTTS(text, finish));
}

// ===== 카운트다운 + 진행 바 (TTS 완료 후 N초) =====
function startWaitCountdown(onDone) {
  clearInterval(countdownTimer);
  clearTimeout(waitTimer);

  let remaining = waitSeconds;
  const total = waitSeconds;
  let elapsed = 0;

  document.getElementById('progress').style.width = '0%';
  document.getElementById('countdown').textContent = `다음 단어까지 ${remaining}초`;

  // 뜻 가리기 모드: 카운트다운 시작 시 뜻 공개
  if (hideMeaning) {
    const meaning = document.querySelector('.meaning');
    const exKo = document.querySelector('.example-ko');
    if (meaning) meaning.classList.remove('hidden-meaning');
    if (exKo) exKo.classList.remove('hidden-meaning');
  }

  countdownTimer = setInterval(() => {
    elapsed += 0.1;
    remaining = Math.max(0, waitSeconds - Math.floor(elapsed));
    const pct = Math.min(100, (elapsed / total) * 100);
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('countdown').textContent = `다음 단어까지 ${remaining}초`;
  }, 100);

  waitTimer = setTimeout(() => {
    clearInterval(countdownTimer);
    document.getElementById('countdown').textContent = '';
    document.getElementById('progress').style.width = '100%';
    onDone && onDone();
  }, waitSeconds * 1000);
}

let currentAudioEl = null; // 현재 재생 중인 Audio 엘리먼트 추적

function stopAllAudio() {
  window.speechSynthesis?.cancel();
  if (currentAudioEl) {
    currentAudioEl.pause();
    currentAudioEl.onended = null;
    currentAudioEl.onerror = null;
    currentAudioEl = null;
  }
}

function stopTimers() {
  clearInterval(countdownTimer);
  clearTimeout(waitTimer);
  clearTimeout(revealTimer);
  stopAllAudio();
  document.getElementById('countdown').textContent = '';
  document.getElementById('progress').style.width = '0%';
}

// ===== 단어 렌더링 =====
const SPELLING_STEPS = [64, 52, 42, 34, 28, 22, 18];

function adjustSpellingSize() {
  const el = document.querySelector('.spelling');
  const card = document.getElementById('card');
  if (!el || !card) return;
  const available = card.clientWidth - 80;
  let i = 0;
  el.style.fontSize = SPELLING_STEPS[i] + 'px';
  el.style.whiteSpace = 'nowrap';
  while (el.scrollWidth > available && i < SPELLING_STEPS.length - 1) {
    i++;
    el.style.fontSize = SPELLING_STEPS[i] + 'px';
  }
  if (el.scrollWidth > available) el.style.whiteSpace = 'normal';
}
window.addEventListener('resize', adjustSpellingSize);

function renderWordInfo(w) {
  const exHtml = w.exEn ? `
    <div class="example-wrap">
      <div class="example-label">Example</div>
      <div class="example-en">${w.exEn}</div>
      ${w.exKo ? `<div class="example-ko${hideMeaning ? ' hidden-meaning' : ''}">${w.exKo}</div>` : ''}
    </div>` : '';

  document.getElementById('card').innerHTML = `
    <div class="pos-badge">${w.pos || '—'}</div>
    <div class="word-number">#${historyPos + 1} / ${words.length}</div>
    <div class="audio-icon" id="audioIcon">🔊</div>
    <div class="spelling">${w.spelling}</div>
    ${w.ipa ? `<div class="ipa">${w.ipa}</div>` : ''}
    ${w.krPron ? `<div class="kr-pronunciation">[ ${w.krPron} ]</div>` : ''}
    ${w.meaning ? `<div class="meaning${hideMeaning ? ' hidden-meaning' : ''}">${w.meaning}</div>` : ''}
    ${exHtml}
  `;
  adjustSpellingSize();
}

// ===== 단어 표시 + 재생 흐름 =====
function showWord(idx, isInitial) {
  if (isInitial) { history = [idx]; historyPos = 0; }
  else { history = history.slice(0, historyPos + 1); history.push(idx); historyPos = history.length - 1; }

  stopTimers();
  setSourceLabel('');
  renderWordInfo(words[idx]);

  // 다음 단어 미리 결정 + 프리로딩
  nextIdx = getRandomIndex();
  preloadWord(words[nextIdx].spelling);
  if (words[nextIdx].exEn) preloadExample(words[nextIdx].exEn);

  if (isPlaying) startPlaySequence(words[idx]);
}

// 재생 순서: 단어 발음 → (예문 TTS) → 카운트다운 → 다음 단어
function startPlaySequence(w) {
  playWordAudio(w.spelling, () => {
    if (!isPlaying) return;

    const afterAll = () => {
      if (!isPlaying) return;
      startWaitCountdown(() => {
        if (!isPlaying) return;
        goToNext();
      });
    };

    if (readExample && w.exEn) {
      playExampleAudio(w.exEn, afterAll);
    } else {
      afterAll();
    }
  });
}

function goToNext() {
  if (nextIdx === null) nextIdx = getRandomIndex();
  showWord(nextIdx, false);
}

// ===== 컨트롤 =====
function togglePlay() {
  if (words.length === 0) return;
  isPlaying = !isPlaying;
  document.getElementById('playBtn').textContent = isPlaying ? '⏸ 일시정지' : '▶ 재생';
  if (isPlaying) {
    const w = words[history[historyPos]];
    if (w) startPlaySequence(w);
  } else {
    stopTimers();
  }
}

function nextWord() {
  stopTimers();
  if (historyPos < history.length - 1) {
    historyPos++;
    renderWordInfo(words[history[historyPos]]);
    adjustSpellingSize();
    if (isPlaying) startPlaySequence(words[history[historyPos]]);
  } else {
    goToNext();
  }
}

function prevWord() {
  if (historyPos <= 0) return;
  stopTimers();
  historyPos--;
  renderWordInfo(words[history[historyPos]]);
  adjustSpellingSize();
  if (isPlaying) startPlaySequence(words[history[historyPos]]);
}

loadSheet();
</script>
