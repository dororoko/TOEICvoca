<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--

<script>console.log('%c오늘의 20단어 v1.0.0', 'color:#a78bfa;font-weight:bold;');</script>
<title>오늘의 20단어</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f1a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .container { width: 100%; max-width: 640px; padding: 24px; text-align: center; }
  .status { font-size: 13px; color: #888; margin-bottom: 24px; min-height: 20px; }
  .date-label { font-size: 14px; color: #6a5a9a; margin-bottom: 8px; letter-spacing: 0.5px; }
  .card {
    background: linear-gradient(135deg, #1e1e3a, #2a1a4a);
    border: 1px solid #3a2a6a;
    border-radius: 24px;
    padding: 40px 36px 32px;
    margin-bottom: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .pos-badge {
    position: absolute; top: 20px; left: 20px;
    background: #4a2a8a; color: #c9a0ff;
    font-size: 11px; font-weight: 600;
    padding: 4px 12px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .word-number { position: absolute; top: 20px; right: 20px; color: #555; font-size: 12px; }
  .spelling {
    font-size: 64px; font-weight: 700; letter-spacing: -2px;
    color: #fff; margin-bottom: 12px; line-height: 1.1;
    white-space: nowrap; max-width: 100%;
  }
  .ipa { font-size: 20px; color: #a78bfa; margin-bottom: 12px; font-style: italic; }
  .kr-pronunciation { font-size: 15px; color: #7c6fb0; margin-bottom: 16px; }
  .meaning { font-size: 19px; color: #d1c4ff; line-height: 1.5; max-width: 480px; transition: filter 0.3s; }
  .meaning.hidden-meaning { filter: blur(8px); user-select: none; }
  .example-wrap { margin-top: 20px; width: 100%; border-top: 1px solid #3a2a6a; padding-top: 16px; text-align: left; }
  .example-label { font-size: 10px; font-weight: 600; color: #6a5a9a; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
  .example-en { font-size: 15px; color: #c9b8ff; line-height: 1.6; margin-bottom: 6px; }
  .example-en.example-playing { animation: exPulse 1s infinite; }
  .example-ko { font-size: 13px; color: #7c6fb0; line-height: 1.5; transition: filter 0.3s; }
  .example-ko.hidden-meaning { filter: blur(8px); user-select: none; }
  @keyframes exPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .audio-icon { font-size: 26px; margin-bottom: 10px; opacity: 0.5; transition: opacity 0.3s; }
  .audio-icon.playing { opacity: 1; animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
  .countdown { font-size: 12px; color: #6a5a9a; margin-bottom: 20px; min-height: 18px; letter-spacing: 0.5px; }
  .progress-bar { width: 100%; height: 4px; background: #2a1a4a; border-radius: 2px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #a78bfa); border-radius: 2px; transition: width 0.1s linear; }
  .controls { display: flex; gap: 16px; justify-content: center; align-items: center; margin-bottom: 16px; }
  .btn {
    background: #2a1a4a; border: 1px solid #4a2a8a; color: #c9a0ff;
    border-radius: 50px; padding: 12px 24px; font-size: 14px;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .btn:hover { background: #3a2a6a; transform: scale(1.05); }
  .btn-main {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border: none; color: #fff; padding: 14px 32px; font-size: 16px; font-weight: 600;
  }
  .btn-main:hover { opacity: 0.9; transform: scale(1.05); }
  .btn-icon { width: 44px; height: 44px; padding: 0; justify-content: center; font-size: 18px; }
  .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .option-row { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #aaa; }
  .option-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #a78bfa; cursor: pointer; }
  .option-row label { cursor: pointer; }
  .wait-row { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 13px; color: #aaa; }
  .wait-row input[type="range"] { -webkit-appearance: none; width: 120px; height: 4px; background: #2a1a4a; border-radius: 2px; outline: none; }
  .wait-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #a78bfa; cursor: pointer; }
  .wait-row input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #a78bfa; border: none; cursor: pointer; }
  .wait-val { min-width: 28px; color: #c9a0ff; font-weight: 600; font-size: 13px; }
  .volume-row { display: flex; align-items: center; gap: 10px; justify-content: center; }
  .volume-row span { font-size: 16px; color: #888; }
  .volume-row input[type="range"] { -webkit-appearance: none; width: 140px; height: 4px; background: #2a1a4a; border-radius: 2px; outline: none; }
  .volume-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #a78bfa; cursor: pointer; }
  .volume-row input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #a78bfa; border: none; cursor: pointer; }
  .audio-source { font-size: 11px; color: #555; margin-top: 10px; min-height: 16px; letter-spacing: 0.5px; }
  .counter { font-size: 12px; color: #555; margin-top: 10px; }
  .sheet-link-btn {
    background: transparent; border: 1px solid #3a2a6a; color: #888;
    border-radius: 20px; padding: 8px 18px; font-size: 12px;
    cursor: pointer; transition: all 0.2s; margin-top: 14px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .sheet-link-btn:hover { border-color: #7c3aed; color: #c9a0ff; }
  .loading { color: #a78bfa; font-size: 16px; }
  .error { color: #f87171; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="date-label" id="dateLabel"></div>
  <div class="status" id="status">스프레드시트 불러오는 중...</div>
  <div class="card" id="card">
    <div class="loading">⏳ 단어 데이터를 불러오고 있어요...</div>
  </div>
  <div class="countdown" id="countdown"></div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="controls">
    <button class="btn btn-icon" onclick="prevWord()">⬅</button>
    <button class="btn btn-main" id="playBtn" onclick="togglePlay()">▶ 시작</button>
    <button class="btn btn-icon" onclick="nextWord()">➡</button>
  </div>
  <div class="options-grid">
    <div class="volume-row">
      <span>🔈</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="30" oninput="setVolume(this.value)">
      <span>🔊</span>
    </div>
    <div class="wait-row">
      <span>⏱ 대기</span>
      <input type="range" id="waitSlider" min="1" max="10" value="5" oninput="setWait(this.value)">
      <span class="wait-val" id="waitVal">5초</span>
    </div>
    <div class="option-row">
      <input type="checkbox" id="hideMeaningCheck" onchange="onHideMeaningToggle(this.checked)">
      <label for="hideMeaningCheck">단어/예문 뜻 가리기 (TTS 완료 전 표시)</label>
    </div>
    <div class="option-row">
      <input type="checkbox" id="readExampleCheck" onchange="readExample = this.checked">
      <label for="readExampleCheck">예문 읽기</label>
    </div>
  </div>
  <div class="audio-source" id="audioSource"></div>
  <div class="counter" id="counter"></div>
  <button class="sheet-link-btn" onclick="openSheet()">📊 스프레드시트로 바로 가기</button>
</div>

<script>
const SHEET_ID = '1THexNEpg2h7CnceWDumdRNYziQzq3B9ptwzKLFO7hvQ';
const PROXY_URL = 'https://toeicvoka.dororoko.workers.dev';
const TODAY_COUNT = 20;

// ===== 날짜 시드로 오늘의 20개 인덱스 뽑기 =====
function getTodayIndices(totalCount) {
  const now = new Date();
  const day = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  console.log('getTodayIndices 실행됨. day:', day, 'totalCount:', totalCount);
  const picked = [];
  for (let i = 0; picked.length < Math.min(TODAY_COUNT, totalCount); i++) {
    const idx = (day + i * 31) % totalCount;
    if (!picked.includes(idx)) picked.push(idx);
  }
  console.log('picked:', JSON.stringify(picked));
  return picked;
}

// 날짜 표시
function setDateLabel() {
  const now = new Date();
  const label = `📅 ${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 오늘의 ${TODAY_COUNT}단어`;
  document.getElementById('dateLabel').textContent = label;
}
setDateLabel();

// ===== 전역 상태 =====
let allWords = [];       // 전체 단어 (건드리지 않음)
let todayWords = [];     // 오늘의 20단어 (allWords의 부분집합)
let usedIndices = [];    // todayWords 기준 사용된 인덱스
let history = [];        // todayWords 기준 방문 인덱스 기록
let historyPos = -1;
let nextIdx = null;
let isPlaying = false;
let waitTimer = null, countdownTimer = null, revealTimer = null;
let currentVolume = 0.3, waitSeconds = 5;
let hideMeaning = false, readExample = false;
let currentAudioEl = null;

// ===== 설정 =====
function setVolume(v) { currentVolume = v / 100; }
function setWait(v) { waitSeconds = parseInt(v); document.getElementById('waitVal').textContent = v + '초'; }
function openSheet() { window.open(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`, '_blank'); }
function onHideMeaningToggle(checked) {
  hideMeaning = checked;
  const m = document.querySelector('.meaning'), k = document.querySelector('.example-ko');
  if (m) m.classList.toggle('hidden-meaning', checked);
  if (k) k.classList.toggle('hidden-meaning', checked);
}

// ===== 시트 로드 =====
window.handleSheetData = function(data) {
  try {
    const allRows = data.table.rows;
    if (!allRows || allRows.length === 0) throw new Error('데이터 행이 없어요.');
    const cols = allRows[0].c.map(c => String(c?.v ?? '').trim().toLowerCase());
    const fc = k => cols.findIndex(c => c.includes(k));
    const cm = {
      spelling: fc('스펠링') >= 0 ? fc('스펠링') : fc('spelling'),
      pos: fc('품사'), meaning: fc('뜻'), ipa: fc('ipa'),
      krPron: fc('한국어 발음') >= 0 ? fc('한국어 발음') : fc('발음'),
      exEn: fc('예문'),
      exKo: fc('예문 한국어') >= 0 ? fc('예문 한국어') : fc('한국어 해석'),
    };
    if (cm.spelling < 0) throw new Error('스펠링 컬럼을 찾을 수 없어요. 컬럼: ' + cols.join(', '));

    allWords = allRows.slice(1).map(r => {
      const g = i => i >= 0 ? String(r.c[i]?.v ?? '').trim() : '';
      return {
        spelling: g(cm.spelling), pos: g(cm.pos), meaning: g(cm.meaning),
        ipa: g(cm.ipa), krPron: g(cm.krPron), exEn: g(cm.exEn), exKo: g(cm.exKo)
      };
    }).filter(w => w.spelling);

    if (!allWords.length) throw new Error('단어 데이터가 없어요.');

    // 디버그: 실제 값 콘솔 출력
    const indices = getTodayIndices(allWords.length);
    console.log('allWords.length:', allWords.length);
    console.log('indices:', indices);
    console.log('indices[0]:', indices[0], '→ allWords[indices[0]]:', allWords[indices[0]]);
    todayWords = indices.map(i => allWords[i]);

    // todayWords 정상 여부 검증
    if (!todayWords.length) throw new Error('오늘의 단어를 추출하지 못했어요.');
    todayWords.forEach((w, i) => {
      if (!w || typeof w.spelling === 'undefined') throw new Error(`todayWords[${i}]가 비정상이에요.`);
    });

    document.getElementById('status').textContent = `✅ 전체 ${allWords.length}개 중 오늘의 ${todayWords.length}단어`;
    document.getElementById('counter').textContent = `오늘의 ${todayWords.length}단어`;

    // usedIndices 초기화 후 첫 단어
    usedIndices = [];
    history = [];
    historyPos = -1;
    nextIdx = null;

    const firstIdx = getRandomIndex();
    showWord(firstIdx, true);
  } catch(e) {
    document.getElementById('status').innerHTML = `<span class="error">❌ 실패: ${e.message}</span>`;
    document.getElementById('card').innerHTML = `<div class="error">${e.message}</div>`;
  }
};

function loadSheet() {
  const s = document.createElement('script');
  s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:handleSheetData&gid=0`;
  s.onerror = () => { document.getElementById('status').innerHTML = '<span class="error">❌ 로드 실패</span>'; };
  document.body.appendChild(s);
  setTimeout(() => {
    if (!allWords.length) document.getElementById('status').innerHTML = '<span class="error">❌ 응답 없음 (10초 초과)</span>';
  }, 10000);
}

// ===== 랜덤 인덱스 (todayWords 기준) =====
function getRandomIndex() {
  if (usedIndices.length >= todayWords.length) usedIndices = [];
  const remaining = [...Array(todayWords.length).keys()].filter(i => !usedIndices.includes(i));
  const pool = remaining.length > 0 ? remaining : [...Array(todayWords.length).keys()];
  const idx = pool[Math.floor(Math.random() * pool.length)];
  usedIndices.push(idx);
  return idx;
}

// ===== 프리로딩 =====
const preloadCache = {};
function fetchWithTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal }).finally(() => clearTimeout(t));
}
function getGoogleTTSUrl(text) { return `${PROXY_URL}/?q=${encodeURIComponent(text)}&tl=en`; }
function testAudioLoadable(url, ms) {
  return new Promise(resolve => {
    const a = new Audio(); let done = false;
    const fin = ok => { if (!done) { done = true; resolve(ok ? a : null); } };
    setTimeout(() => fin(false), ms);
    a.oncanplaythrough = () => fin(true);
    a.onerror = () => fin(false);
    a.preload = 'auto'; a.src = url; a.load();
  });
}
function preloadWord(word) {
  if (preloadCache[word]) return preloadCache[word];
  preloadCache[word] = (async () => {
    try {
      const res = await fetchWithTimeout(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`, 2500);
      const data = await res.json();
      const url = data[0]?.phonetics?.find(p => p.audio)?.audio || null;
      if (url) { const el = new Audio(); el.preload='auto'; el.src=url; el.load(); return {type:'dict',audioEl:el}; }
    } catch {}
    const ga = await testAudioLoadable(getGoogleTTSUrl(word), 1800);
    if (ga) return {type:'gtts', audioEl:ga};
    return {type:'tts', audioEl:null};
  })();
  return preloadCache[word];
}
function preloadExample(text) {
  if (!text) return Promise.resolve(null);
  const key = 'ex:' + text;
  if (preloadCache[key]) return preloadCache[key];
  preloadCache[key] = testAudioLoadable(getGoogleTTSUrl(text), 2500);
  return preloadCache[key];
}

// ===== 음성 재생 =====
let cachedVoices = [];
if ('speechSynthesis' in window) {
  cachedVoices = window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => { cachedVoices = window.speechSynthesis.getVoices(); };
}
function getBestVoice() {
  const v = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
  for (const n of ['Google US English','Microsoft Aria Online','Microsoft Jenny Online','Samantha']) {
    const found = v.find(x => x.name.includes(n)); if (found) return found;
  }
  return v.find(x=>x.lang==='en-US'&&!x.localService)||v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'));
}
function setSourceLabel(t) { const el=document.getElementById('audioSource'); if(el) el.textContent=t; }

function playBrowserTTS(text, onEnd) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.92; u.pitch=1.0; u.volume=currentVolume;
    const voice=getBestVoice(); if(voice){u.voice=voice;u.lang=voice.lang;}
    u.onend=onEnd; u.onerror=onEnd;
    setTimeout(()=>window.speechSynthesis.speak(u),30);
    setSourceLabel('브라우저 내장 TTS'+(voice?` (${voice.name})`:''));
  } catch { onEnd&&onEnd(); }
}

function playWordAudio(word, onEnd) {
  const icon = document.getElementById('audioIcon');
  if (icon) icon.classList.add('playing');
  const finish = () => { if(icon) icon.classList.remove('playing'); onEnd&&onEnd(); };
  preloadWord(word).then(entry => {
    if (entry.type==='tts'||!entry.audioEl) { playBrowserTTS(word,finish); return; }
    const el=entry.audioEl; currentAudioEl=el;
    el.volume=currentVolume; try{el.currentTime=0;}catch{}
    el.onended=()=>{currentAudioEl=null;finish();};
    el.onerror=()=>{currentAudioEl=null;playBrowserTTS(word,finish);};
    el.play().then(()=>setSourceLabel(entry.type==='dict'?'Dictionary API 원어민 음성':'Google Translate TTS'))
             .catch(()=>playBrowserTTS(word,finish));
  }).catch(()=>playBrowserTTS(word,finish));
}

function playExampleAudio(text, onEnd) {
  const exEl = document.querySelector('.example-en');
  if (exEl) exEl.classList.add('example-playing');
  const finish = () => { if(exEl) exEl.classList.remove('example-playing'); onEnd&&onEnd(); };
  preloadExample(text).then(audioEl => {
    if (!audioEl) { playBrowserTTS(text,finish); return; }
    currentAudioEl=audioEl; audioEl.volume=currentVolume;
    try{audioEl.currentTime=0;}catch{}
    audioEl.onended=()=>{currentAudioEl=null;finish();};
    audioEl.onerror=()=>{currentAudioEl=null;playBrowserTTS(text,finish);};
    audioEl.play().then(()=>setSourceLabel('예문 Google Translate TTS')).catch(()=>playBrowserTTS(text,finish));
  }).catch(()=>playBrowserTTS(text,finish));
}

// ===== 카운트다운 =====
function startWaitCountdown(onDone) {
  clearInterval(countdownTimer); clearTimeout(waitTimer);
  let elapsed = 0;
  document.getElementById('progress').style.width='0%';
  document.getElementById('countdown').textContent=`다음 단어까지 ${waitSeconds}초`;
  if (hideMeaning) {
    document.querySelector('.meaning')?.classList.remove('hidden-meaning');
    document.querySelector('.example-ko')?.classList.remove('hidden-meaning');
  }
  countdownTimer = setInterval(() => {
    elapsed += 0.1;
    document.getElementById('progress').style.width = Math.min(100,(elapsed/waitSeconds)*100)+'%';
    document.getElementById('countdown').textContent = `다음 단어까지 ${Math.max(0,waitSeconds-Math.floor(elapsed))}초`;
  }, 100);
  waitTimer = setTimeout(() => {
    clearInterval(countdownTimer);
    document.getElementById('countdown').textContent='';
    document.getElementById('progress').style.width='100%';
    onDone&&onDone();
  }, waitSeconds*1000);
}

function stopAllAudio() {
  window.speechSynthesis?.cancel();
  if (currentAudioEl) { currentAudioEl.pause(); currentAudioEl.onended=null; currentAudioEl.onerror=null; currentAudioEl=null; }
}
function stopTimers() {
  clearInterval(countdownTimer); clearTimeout(waitTimer); clearTimeout(revealTimer);
  stopAllAudio();
  document.getElementById('countdown').textContent='';
  document.getElementById('progress').style.width='0%';
}

// ===== 렌더링 =====
const SPELLING_STEPS = [64,52,42,34,28,22,18];
function adjustSpellingSize() {
  const el=document.querySelector('.spelling'), card=document.getElementById('card');
  if (!el||!card) return;
  const avail=card.clientWidth-80; let i=0;
  el.style.fontSize=SPELLING_STEPS[0]+'px'; el.style.whiteSpace='nowrap';
  while (el.scrollWidth>avail&&i<SPELLING_STEPS.length-1) el.style.fontSize=SPELLING_STEPS[++i]+'px';
  if (el.scrollWidth>avail) el.style.whiteSpace='normal';
}
window.addEventListener('resize', adjustSpellingSize);

function renderWordInfo(w) {
  const exHtml = w.exEn ? `
    <div class="example-wrap">
      <div class="example-label">Example</div>
      <div class="example-en">${w.exEn}</div>
      ${w.exKo ? `<div class="example-ko${hideMeaning?' hidden-meaning':''}">${w.exKo}</div>` : ''}
    </div>` : '';
  document.getElementById('card').innerHTML = `
    <div class="pos-badge">${w.pos||'—'}</div>
    <div class="word-number">#${historyPos+1} / ${todayWords.length}</div>
    <div class="audio-icon" id="audioIcon">🔊</div>
    <div class="spelling">${w.spelling}</div>
    ${w.ipa?`<div class="ipa">${w.ipa}</div>`:''}
    ${w.krPron?`<div class="kr-pronunciation">[ ${w.krPron} ]</div>`:''}
    ${w.meaning?`<div class="meaning${hideMeaning?' hidden-meaning':''}">${w.meaning}</div>`:''}
    ${exHtml}
  `;
  adjustSpellingSize();
}

// ===== 단어 표시 =====
function showWord(idx, isInitial) {
  if (isInitial) { history=[idx]; historyPos=0; }
  else { history=history.slice(0,historyPos+1); history.push(idx); historyPos=history.length-1; }
  stopTimers(); setSourceLabel('');
  renderWordInfo(todayWords[idx]);

  // 다음 단어 프리로딩 (안전하게 todayWords 범위 확인)
  nextIdx = getRandomIndex();
  const nextWord = todayWords[nextIdx];
  if (nextWord) {
    preloadWord(nextWord.spelling);
    if (nextWord.exEn) preloadExample(nextWord.exEn);
  }

  if (isPlaying) startPlaySequence(todayWords[idx]);
}

function startPlaySequence(w) {
  playWordAudio(w.spelling, () => {
    if (!isPlaying) return;
    const afterAll = () => {
      if (!isPlaying) return;
      startWaitCountdown(() => { if (!isPlaying) return; goToNext(); });
    };
    if (readExample && w.exEn) playExampleAudio(w.exEn, afterAll);
    else afterAll();
  });
}

function goToNext() {
  if (nextIdx===null) nextIdx=getRandomIndex();
  showWord(nextIdx, false);
}

// ===== 컨트롤 =====
function togglePlay() {
  if (!todayWords.length) return;
  isPlaying=!isPlaying;
  document.getElementById('playBtn').textContent=isPlaying?'⏸ 일시정지':'▶ 재생';
  if (isPlaying) { const w=todayWords[history[historyPos]]; if(w) startPlaySequence(w); }
  else stopTimers();
}

function nextWord() {
  if (!todayWords.length) return;
  stopTimers();
  if (historyPos<history.length-1) {
    historyPos++;
    renderWordInfo(todayWords[history[historyPos]]); adjustSpellingSize();
    if (isPlaying) startPlaySequence(todayWords[history[historyPos]]);
  } else goToNext();
}

function prevWord() {
  if (!todayWords.length||historyPos<=0) return;
  stopTimers(); historyPos--;
  renderWordInfo(todayWords[history[historyPos]]); adjustSpellingSize();
  if (isPlaying) startPlaySequence(todayWords[history[historyPos]]);
}

loadSheet();
</script>
